[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "py-qaoa-maxcut"
version = "1.0.0"
description = "QAOA for MAX-CUT combinatorial optimization"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Mahmoud ElNemer", email = "sultanelnemer@gmail.com"}]
keywords = ["python", "qaoa", "max-cut", "optimization", "quantum"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ElNeMeR70/py-qaoa-maxcut"
Repository = "https://github.com/ElNeMeR70/py-qaoa-maxcut"
